services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trend
      POSTGRES_USER: trend
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - trend_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trend -d trend"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    ports:
      - "127.0.0.1:8089:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://trend:${POSTGRES_PASSWORD}@db:5432/trend
      ALLOWED_ORIGINS: http://localhost:8089,http://127.0.0.1:8089
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
volumes:
  trend_postgres:
